model_list:
  - model_name: tier-1-orchestrator
    litellm_params:
      model: ollama/qwen3:8b
      api_base: http://localhost:11434

  - model_name: tier-2-worker
    litellm_params:
      model: ollama/qwen3.6:35b
      api_base: http://localhost:11434

  # WP-T: Actorul nocturn (Qwen 35B). Timeout generos — job de noapte, cold-start ~90s +
  # generare lungă (ipoteze JSON) depășesc cu ușurință cei 120s ai tier-urilor interactive.
  - model_name: trading-actor
    litellm_params:
      model: ollama/qwen3.6:35b
      api_base: http://localhost:11434
      timeout: 900

router_settings:
  num_retries: 2
  timeout: 120

general_settings:
  master_key: sk-orchestrator-local
