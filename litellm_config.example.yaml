model_list:
  - model_name: KAGE_TIER1_NAME
    litellm_params:
      model: ollama/KAGE_TIER1_MODEL
      api_base: KAGE_OLLAMA_URL

  - model_name: KAGE_TIER2_NAME
    litellm_params:
      model: ollama/KAGE_TIER2_MODEL
      api_base: KAGE_OLLAMA_URL

  # WP-T (opțional): Actorul nocturn — același model ca tier-2, dar cu timeout mare (cold-start
  # 35B + generare lungă depășesc cei 120s interactivi). Referit de trading.actor.litellm_name.
  - model_name: trading-actor
    litellm_params:
      model: ollama/KAGE_TIER2_MODEL
      api_base: KAGE_OLLAMA_URL
      timeout: 900

router_settings:
  num_retries: 2
  timeout: 120

general_settings:
  # Placeholder: scripts/setup.sh îl înlocuiește cu o cheie aleatoare, salvată și în
  # kage_config.json (litellm_key). litellm_config.yaml generat nu se comite.
  master_key: KAGE_LITELLM_KEY
